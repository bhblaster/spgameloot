<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chic Style - Fashion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Chic Style</div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">Collections</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h1>Discover Your True Style</h1>
            <p>Explore the latest trends in fashion and elevate your wardrobe.</p>
            <a href="#" class="btn">Shop Now</a>
        </section>
        <section class="featured">
            <h2>Featured Collections</h2>
            <div class="product-grid">
                <div class="product-card">
                    <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&q=80&w=400&h=500" alt="Summer Dress">
                    <h3>Summer Dress</h3>
                    <p>$49.99</p>
                </div>
                <div class="product-card">
                    <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&q=80&w=400&h=500" alt="Denim Jacket">
                    <h3>Denim Jacket</h3>
                    <p>$89.99</p>
                </div>
                <div class="product-card">
                    <img src="https://images.unsplash.com/photo-1495385794356-15371f348c31?auto=format&fit=crop&q=80&w=400&h=500" alt="Casual Wear">
                    <h3>Casual Wear</h3>
                    <p>$59.99</p>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Chic Style. All rights reserved.</p>
    </footer>
</body>
</html>
